name: CI

on:
    pull_request:
        branches: ["main"]

jobs:
    pipes:
        uses: dragunovartem99/pipes/.github/workflows/ci-checks.yaml@v3.1.0
        with:
            # shfmt isn't on the runner image; shellcheck is
            install: sudo apt-get install -y shfmt
            runner: make
            checks: '["fmt-check", "lint", "build"]'
